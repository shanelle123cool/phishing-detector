```html
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détecteur de phishing 🛡️</title>
</head>

<body>

    <h1>🛡️ Détecteur de phishing</h1>

    <p>Vérifiez un lien avant de cliquer dessus.</p>

    <input type="text" id="urlInput" placeholder="https://exemple.com">

    <button onclick="checkURL()">🔍 Vérifier le lien</button>

    <div id="result"></div>

    <script>
        function checkURL() {
            const url = document.getElementById("urlInput").value;
            const result = document.getElementById("result");

            if (!url) {
                result.innerHTML = "⚠️ Veuillez entrer un lien.";
                return;
            }

            const motsSuspects = [
                "login",
                "verify",
                "password",
                "account",
                "free",
                "urgent"
            ];

            let suspect = false;

            for (let mot of motsSuspects) {
                if (url.toLowerCase().includes(mot)) {
                    suspect = true;
                }
            }

            if (suspect) {
                result.innerHTML = "🔴 Ce lien semble suspect.";
            } else {
                result.innerHTML = "🟢 Aucun signe évident de phishing détecté.";
            }
        }
    </script>

</body>
</html>
```

Tu peux copier-coller ce code directement dans ton fichier `.html`.
